name: Trust iOS Release E2E (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-e2e:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Create two disposable iPhone 17 Pro simulators on a compatible iOS runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_and_type() {
            xcrun simctl list runtimes -j | jq -r '
              [.runtimes[]
                | select(.isAvailable == true and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-"))) as $runtime
                | $runtime.supportedDeviceTypes[]?
                | {runtime: $runtime.identifier, version: $runtime.version,
                   type: (.bundleIdentifier // .identifier), name: .name}
                | select(.type != null and (.name | startswith("iPhone")))] as $all
              | ($all | map(select(.name == "iPhone 17 Pro"))) as $pro
              | (if ($pro | length) > 0 then $pro else $all end)
              | sort_by(.version | split(".") | map(tonumber))
              | last
              | if . then [.runtime, .type] | @tsv else empty end'
          }

          selected=$(runtime_and_type)
          if [[ -z "$selected" ]]; then
            xcodebuild -downloadPlatform iOS
            selected=$(runtime_and_type)
          fi
          runtime_id=$(cut -f1 <<< "$selected")
          device_type_id=$(cut -f2 <<< "$selected")
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "Could not find an available iOS runtime supporting an installed iPhone device type."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep -F 'iPhone 17 Pro' || true
            exit 1
          fi
          echo "Using runtime $runtime_id and device type $device_type_id"

          simulator_a=$(xcrun simctl create "Trust Release E2E A $GITHUB_RUN_ID" "$device_type_id" "$runtime_id")
          echo "TRUST_E2E_SIMULATOR_A=$simulator_a" >> "$GITHUB_ENV"
          simulator_b=$(xcrun simctl create "Trust Release E2E B $GITHUB_RUN_ID" "$device_type_id" "$runtime_id")
          echo "TRUST_E2E_SIMULATOR_B=$simulator_b" >> "$GITHUB_ENV"
          echo "TRUST_E2E_OUTPUT=$RUNNER_TEMP/trust-release-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_a"
          xcrun simctl boot "$simulator_b"
          xcrun simctl bootstatus "$simulator_a" -b
          xcrun simctl bootstatus "$simulator_b" -b

      - name: Run the full local release E2E matrix with Development fixtures
        run: >-
          python3 apps/trust-ios/Scripts/run_release_e2e.py
          --lane all
          --store memory
          --allow-review-fixture
          --device "$TRUST_E2E_SIMULATOR_A"
          --alice-device "$TRUST_E2E_SIMULATOR_A"
          --bob-device "$TRUST_E2E_SIMULATOR_B"
          --output "$TRUST_E2E_OUTPUT"

      - name: Remove the two workflow-owned simulators
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${TRUST_E2E_SIMULATOR_A:-}" ]]; then
            xcrun simctl shutdown "$TRUST_E2E_SIMULATOR_A" >/dev/null 2>&1
            xcrun simctl delete "$TRUST_E2E_SIMULATOR_A" >/dev/null 2>&1
          fi
          if [[ -n "${TRUST_E2E_SIMULATOR_B:-}" ]]; then
            xcrun simctl shutdown "$TRUST_E2E_SIMULATOR_B" >/dev/null 2>&1
            xcrun simctl delete "$TRUST_E2E_SIMULATOR_B" >/dev/null 2>&1
          fi

      - name: Upload E2E results and local service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-ios-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trust-release-e2e-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14
