name: Trust CI

on:
  pull_request:
    paths:
      - "apps/trust-api/**"
      - "apps/trust-ios/**"
      - "apps/jointrust-web/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/trust-api/**"
      - "apps/trust-ios/**"
      - "apps/jointrust-web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: trust
          POSTGRES_DB: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trust -d trust"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run API and Postgres integration tests
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5433;Database=trust;Username=trust;Password=trust
        run: >-
          dotnet test apps/trust-api/TrustApi.sln
          --configuration Release
          --results-directory "$RUNNER_TEMP/trust-api-results"
          --logger "trx;LogFileName=trust-api.trx"
      - name: Verify PostgreSQL integration coverage
        run: python3 apps/trust-ios/Scripts/verify_api_postgres_coverage.py "$RUNNER_TEMP/trust-api-results/trust-api.trx"

  ios:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Validate localization coverage and freshness
        run: |
          python3 apps/trust-ios/Scripts/emit_localizations.py
          python3 apps/trust-ios/Scripts/validate_localizations.py
          git diff --exit-code -- 'apps/trust-ios/Resources/**/Localizable.strings' 'apps/trust-ios/Resources/**/InfoPlist.strings'
      - name: Verify default Xcode 27 toolchain
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "The expected Xcode developer directory is missing: $DEVELOPER_DIR"
            exit 1
          fi
          xcodebuild -version | tee "$RUNNER_TEMP/trust-xcode-version.txt"
          xcode_path=$(xcode-select -p)
          echo "Selected Xcode: $xcode_path"
          xcode_version=$(awk '/^Xcode / { print $2; exit }' "$RUNNER_TEMP/trust-xcode-version.txt")
          ios_sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iOS Simulator SDK: $ios_sdk_version"
          if [[ "$xcode_version" != 27.* || "$ios_sdk_version" != 27.* ]]; then
            echo "Expected Xcode 27 and iOS Simulator SDK 27; got Xcode '$xcode_version', SDK '$ios_sdk_version' from '$xcode_path'."
            exit 1
          fi
      - name: Install and boot iPhone 17 Pro simulator
        run: |
          find_available_runtime() {
            xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) and (.version | startswith("27.")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty'
          }

          runtime_id=$(find_available_runtime)
          if [[ -z "$runtime_id" ]]; then
            xcodebuild -downloadPlatform iOS
            runtime_id=$(find_available_runtime)
          fi

          device_type_id=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier' | head -n 1)
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "Could not find an available iOS simulator runtime or iPhone 17 Pro device type."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep -F 'iPhone 17 Pro' || true
            exit 1
          fi

          simulator_id=$(xcrun simctl create "Trust CI iPhone 17 Pro" "$device_type_id" "$runtime_id")
          echo "TRUST_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Build and test iOS simulator scheme
        run: >-
          xcodebuild
          -project apps/trust-ios/Trust.xcodeproj
          -scheme Trust
          -destination "platform=iOS Simulator,id=$TRUST_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/trust-derived-data"
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Install and boot wide iPad simulator
        run: |
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")) and (.version | startswith("27.")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          device_type_id=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPad Pro 13-inch"))] | sort_by(.name) | first | .identifier // empty')
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "Could not find an available iOS runtime or iPad Pro 13-inch simulator type."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep -F 'iPad Pro 13-inch' || true
            exit 1
          fi

          simulator_id=$(xcrun simctl create "Trust CI Wide iPad" "$device_type_id" "$runtime_id")
          echo "TRUST_WIDE_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Run wide-window layout test on iPad
        run: >-
          xcodebuild
          -project apps/trust-ios/Trust.xcodeproj
          -scheme Trust
          -destination "platform=iOS Simulator,id=$TRUST_WIDE_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/trust-derived-data"
          -only-testing:TrustUITests/TrustUsageTests/testWideWindowKeepsPeopleToTheRightOfTheMap
          -resultBundlePath "$RUNNER_TEMP/trust-wide-layout.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Verify wide-window layout test identity passed
        if: always()
        run: |
          result_bundle="$RUNNER_TEMP/trust-wide-layout.xcresult"
          if [[ ! -d "$result_bundle" ]]; then
            echo "The wide-window iPad test result bundle is missing."
            exit 1
          fi
          xcrun xcresulttool get test-results summary --path "$result_bundle" \
            | tee "$RUNNER_TEMP/trust-wide-layout-summary.json"
          xcrun xcresulttool get test-results tests --path "$result_bundle" \
            > "$RUNNER_TEMP/trust-wide-layout-tests.json"
          python3 apps/trust-ios/Scripts/verify_xcresult_test_identity.py \
            --summary "$RUNNER_TEMP/trust-wide-layout-summary.json" \
            --tests "$RUNNER_TEMP/trust-wide-layout-tests.json" \
            --identity TrustUsageTests/testWideWindowKeepsPeopleToTheRightOfTheMap
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Start isolated Development API for opt-in UI tests
        working-directory: apps/trust-api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5089
          Trust__Store: memory
          Trust__SeedReviewCircle: "false"
          Auth__AllowDevelopmentSignIn: "true"
          Auth__SigningKey: development-signing-key-32bytes-min!!
        run: |
          dotnet build TrustApi.csproj --configuration Release
          nohup dotnet bin/Release/net9.0/TrustApi.dll \
            > "$RUNNER_TEMP/trust-local-e2e-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/trust-local-e2e-api.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5089/health/ready >/dev/null; then
              curl --fail --silent http://127.0.0.1:5089/api/v1/local-test-capabilities | jq -e ".developmentOtpWithoutSms == true"
              exit 0
            fi
            sleep 2
          done

          echo "The isolated Development API did not become ready."
          tail -n 200 "$RUNNER_TEMP/trust-local-e2e-api.log"
          exit 1
      - name: Run opt-in local API UI tests (non-serial cases)
        run: >-
          xcodebuild
          -project apps/trust-ios/Trust.xcodeproj
          -scheme Trust.LocalE2E
          -testPlan Trust.LocalE2E
          -destination "platform=iOS Simulator,id=$TRUST_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/trust-derived-data"
          -skip-testing:TrustUITests/TrustRealAPIFeatureTests/testSameAccountHomeHandoffOwnerSetsHome
          -skip-testing:TrustUITests/TrustRealAPIFeatureTests/testSameAccountHomeHandoffFirstUseDeviceTakesOver
          -skip-testing:TrustUITests/TrustRealAPIFeatureTests/testSameAccountHomeHandoffPreviousOwnerDetectsTakeoverAndClear
          -resultBundlePath "$RUNNER_TEMP/trust-local-e2e.xcresult"
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Stop isolated Development API
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/trust-local-e2e-api.pid" ]]; then
            api_pid=$(cat "$RUNNER_TEMP/trust-local-e2e-api.pid")
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          fi
      - name: Verify opt-in UI coverage ran
        if: always()
        run: |
          result_bundle="$RUNNER_TEMP/trust-local-e2e.xcresult"
          if [[ ! -d "$result_bundle" ]]; then
            echo "The opt-in UI test result bundle is missing."
            exit 1
          fi

          xcrun xcresulttool get test-results summary --path "$result_bundle" \
            | tee "$RUNNER_TEMP/trust-local-e2e-summary.json"
          xcrun xcresulttool get test-results tests --path "$result_bundle" \
            > "$RUNNER_TEMP/trust-local-e2e-tests.json"
          python3 apps/trust-ios/Scripts/verify_local_e2e_coverage.py \
            --summary "$RUNNER_TEMP/trust-local-e2e-summary.json" \
            --tests "$RUNNER_TEMP/trust-local-e2e-tests.json" \
            --source apps/trust-ios/Tests/TrustUITests/TrustRealAPIFeatureTests.swift
      - name: Collect DEBUG UI interaction traces
        if: always() && env.TRUST_SIMULATOR_ID != ''
        continue-on-error: true
        run: |
          xcrun simctl spawn "$TRUST_SIMULATOR_ID" log show --style compact --last 30m \
            --predicate 'subsystem == "com.collapsetechnologies.trust" AND (category == "SharingFlow" OR category == "InteractionFlow")' \
            | tee "$RUNNER_TEMP/trust-sharing-flow.log"
      - name: Upload iOS test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: trust-ios-xcresult
          path: |
            ${{ runner.temp }}/trust-derived-data/Logs/Test/*.xcresult
            ${{ runner.temp }}/trust-local-e2e.xcresult
            ${{ runner.temp }}/trust-local-e2e-summary.json
            ${{ runner.temp }}/trust-local-e2e-tests.json
            ${{ runner.temp }}/trust-wide-layout.xcresult
            ${{ runner.temp }}/trust-wide-layout-summary.json
            ${{ runner.temp }}/trust-wide-layout-tests.json
            ${{ runner.temp }}/trust-local-e2e-api.log
            ${{ runner.temp }}/trust-sharing-flow.log
          if-no-files-found: warn
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run web route tests
        working-directory: apps/jointrust-web
        run: npm test
