name: Trust CI

on:
  pull_request:
    paths:
      - "apps/trust-api/**"
      - "apps/trust-ios/**"
      - "apps/jointrust-web/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/trust-api/**"
      - "apps/trust-ios/**"
      - "apps/jointrust-web/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: trust
          POSTGRES_DB: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trust -d trust"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Run API and Postgres integration tests
        env:
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5433;Database=trust;Username=trust;Password=trust
        run: dotnet test apps/trust-api/TrustApi.sln --configuration Release

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install and boot iPhone 17 Pro simulator
        run: |
          xcodebuild -downloadPlatform iOS

          runtime_id=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))] | sort_by(.version | split(".") | map(tonumber)) | last | .identifier // empty')
          device_type_id=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name == "iPhone 17 Pro") | .identifier' | head -n 1)
          if [[ -z "$runtime_id" || -z "$device_type_id" ]]; then
            echo "Could not find an available iOS simulator runtime or iPhone 17 Pro device type."
            xcrun simctl list runtimes
            xcrun simctl list devicetypes | grep -F 'iPhone 17 Pro' || true
            exit 1
          fi

          simulator_id=$(xcrun simctl create "Trust CI iPhone 17 Pro" "$device_type_id" "$runtime_id")
          echo "TRUST_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Build and test iOS simulator scheme
        run: >-
          xcodebuild
          -project apps/trust-ios/Trust.xcodeproj
          -scheme Trust
          -destination "platform=iOS Simulator,id=$TRUST_SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/trust-derived-data"
          CODE_SIGNING_ALLOWED=NO
          test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run web route tests
        working-directory: apps/jointrust-web
        run: npm test
