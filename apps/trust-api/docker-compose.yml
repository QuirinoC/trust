services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trust
      POSTGRES_PASSWORD: trust
      POSTGRES_DB: trust
    ports:
      - "5433:5432"
    volumes:
      - trust-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trust -d trust"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "5088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=trust;Username=trust;Password=trust
      Auth__SigningKey: development-signing-key-32bytes-min!!
      Auth__AllowDevelopmentSignIn: "true"
      Trust__SeedReviewCircle: "true"
      Trust__Store: postgres
      StoreKit__AllowReviewUnlock: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  trust-pg:
