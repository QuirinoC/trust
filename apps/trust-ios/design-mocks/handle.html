<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Handle — Trust mocks</title>
  <link rel="stylesheet" href="mocks.css" />
</head>
<body>
  <div class="screen-page">
    <div class="screen-meta">
      <a class="back" href="index.html">← Gallery</a>
      <h1>Handle</h1>
      <p>Pick @jordan once. No phone, no profile wizard.</p>
    </div>

    <div class="phone">
      <div class="status-bar"><span>9:41</span><span class="sig"><i aria-hidden="true"></i></span></div>
      <div class="cover">
        <div class="cover-brand" style="justify-content:flex-start;padding-top:48px">
          <p class="cover-eyebrow">Your handle</p>
          <h1 class="sheet-title" style="font-size:32px;margin-bottom:4px">Who are you here?</h1>
          <p class="sheet-intro">One field. Never again while it exists.</p>
          <label class="section-label" for="handle">Handle</label>
          <input class="handle-field" id="handle" type="text" value="@jordan" autocomplete="username" />
          <p class="handle-hint">Letters and numbers. Shown to people you invite.</p>
        </div>
        <div class="cover-actions">
          <a class="btn-primary" href="home-sealed.html">Continue</a>
          <a class="btn-ghost" href="login.html">Back</a>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>

    <nav class="screen-links">
      <a href="login.html">← Login</a>
      <a href="home-sealed.html">Continue → Home</a>
    </nav>
  </div>
</body>
</html>
