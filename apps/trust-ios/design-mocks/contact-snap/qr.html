<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scan — Contact Snap</title>
  <style>
    :root {
      --ink: #000;
      --paper: #fff;
      --muted: #5c5c5c;
      --accent: #e10600;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #e8e8e6;
      color: var(--ink);
      padding: 32px 20px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 36px 32px 28px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .wordmark {
      font-family: Didot, "Bodoni 72", "Times New Roman", serif;
      font-style: italic;
      font-size: 28px;
      margin: 0 0 8px;
    }
    .rule {
      height: 1px;
      background: var(--accent);
      margin: 0 auto 20px;
      width: 48px;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    #qr {
      display: inline-grid;
      place-items: center;
      margin: 0 auto 18px;
      padding: 12px;
      background: #fff;
    }
    #qr img, #qr canvas {
      display: block;
      width: 220px;
      height: 220px;
    }
    .url {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      word-break: break-all;
      color: var(--ink);
      margin: 0;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="wordmark">Trust</div>
    <div class="rule"></div>
    <p>Scan with iPhone Camera → Safari<br />(same Wi‑Fi as this Mac)</p>
    <div id="qr"></div>
    <p class="url" id="url"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <script>
    // Prefer LAN IP (not localhost) so the phone can reach this Mac.
    const FALLBACK_LAN = "10.0.0.116";
    const host = location.hostname;
    const lan =
      host && host !== "127.0.0.1" && host !== "localhost" ? host : FALLBACK_LAN;
    const phoneUrl = `http://${lan}:8766/contact-snap/`;
    document.getElementById("url").textContent = phoneUrl;

    const box = document.getElementById("qr");
    if (window.QRCode) {
      QRCode.toCanvas(
        phoneUrl,
        { width: 220, margin: 2, color: { dark: "#000000", light: "#ffffff" } },
        (err, canvas) => {
          if (err) {
            box.textContent = "QR unavailable — use the URL below.";
            return;
          }
          box.appendChild(canvas);
        }
      );
    } else {
      const img = document.createElement("img");
      img.width = 220;
      img.height = 220;
      img.alt = "QR code for contact-snap";
      img.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=" +
        encodeURIComponent(phoneUrl);
      img.onerror = () => {
        box.innerHTML =
          "<p style='margin:0;color:#5c5c5c;font-size:13px'>QR unavailable — use the URL below.</p>";
      };
      box.appendChild(img);
    }
  </script>
</body>
</html>
