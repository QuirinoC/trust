<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trust — People home (Round 8)</title>
<style>
  :root {
    --paper: #fffefa;
    --canvas: #eeede8;
    --ink: #141613;
    --muted: #5e605a;
    --accent: #e10600;
    --chrome: #ffffff;
    --pin: #1f3d34;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #e8e7e1;
    font-family: var(--sans);
    color: var(--ink);
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    background: var(--canvas);
    box-shadow: 0 24px 60px #0002;
  }
  .map {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, #c9d5c8 0%, transparent 55%),
      linear-gradient(160deg, #9eb0a8 0%, #6d7f78 45%, #4a5a54 100%);
  }
  .pill {
    position: absolute;
    top: 58px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--chrome);
    color: var(--ink);
    font: 600 16px/1 var(--sans);
    padding: 11px 18px;
    border-radius: 999px;
    box-shadow: 0 6px 18px #0003;
    letter-spacing: -0.2px;
  }
  .pill span { color: var(--muted); font-size: 11px; margin-left: 6px; font-weight: 700; }
  .pin {
    position: absolute;
    top: 38%;
    left: 52%;
    width: 40px;
    height: 40px;
    margin: -20px;
    border-radius: 50%;
    background: var(--pin);
    color: #fff;
    display: grid;
    place-items: center;
    font: 700 13px var(--sans);
    border: 3px solid #fff;
    box-shadow: 0 4px 12px #0004;
  }
  .locate {
    position: absolute;
    right: 16px;
    bottom: 38%;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--chrome);
    box-shadow: 0 6px 16px #0003;
    display: grid;
    place-items: center;
    font-size: 14px;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 42%;
    background: var(--paper);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 28px #0002;
    padding: 10px 22px 20px;
  }
  .grab {
    width: 36px; height: 5px; border-radius: 4px;
    background: #c9cac2; margin: 0 auto 14px;
  }
  .eyebrow {
    font-size: 10px; letter-spacing: 1.4px; font-weight: 650;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
  }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid #e0dfd8;
  }
  .av {
    width: 44px; height: 44px; border-radius: 50%;
    background: #e4e9dc; display: grid; place-items: center;
    font: 400 17px Georgia, serif; color: #50554b;
  }
  .row h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .row p { margin: 0; font-size: 13px; color: var(--muted); }
  .look {
    margin-left: auto; color: var(--accent);
    border: 1px solid #f0c8be; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
  }
  .tabs {
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 72px; background: var(--paper);
    border-top: 1px solid #e0dfd8;
    display: grid; grid-template-columns: repeat(4, 1fr);
    align-items: center; text-align: center;
    font-size: 10px; color: #777970; padding-bottom: 10px;
  }
  .tabs .on { color: var(--accent); font-weight: 600; }
  .note {
    position: absolute; bottom: -48px; left: 0; right: 0;
    text-align: center; font-size: 12px; color: #6b6d66;
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="map" aria-hidden="true"></div>
    <div class="pill">You + 3 <span>▾</span></div>
    <div class="pin">MC</div>
    <div class="locate" aria-label="Recenter">◎</div>
    <div class="sheet">
      <div class="grab"></div>
      <div class="eyebrow">Shared with you</div>
      <div class="row">
        <div class="av">MC</div>
        <div>
          <h3>Maya Chen</h3>
          <p>Home · Sealed</p>
        </div>
        <div class="look">Look</div>
      </div>
      <div class="row">
        <div class="av">LB</div>
        <div>
          <h3>Leo Brooks</h3>
          <p>Away · Available</p>
        </div>
        <div class="look" style="color:#5e605a;border-color:#e0dfd8">View</div>
      </div>
    </div>
    <div class="tabs">
      <div class="on">People</div>
      <div>Sharing</div>
      <div>Invite</div>
      <div>You</div>
    </div>
  </div>
  <p class="note">Round 8 layout sketch — structure only. Code is SoT.</p>
</body>
</html>
