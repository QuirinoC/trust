<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home (sealed) — Trust mocks</title>
  <link rel="stylesheet" href="mocks.css" />
</head>
<body>
  <div class="screen-page">
    <div class="screen-meta">
      <a class="back" href="index.html">← Gallery</a>
      <h1>Home (sealed)</h1>
      <p>First paint: muted map, sealed marks, people strip — nobody live until Look.</p>
    </div>

    <div class="phone">
      <div class="map-plane"><img src="map.svg" alt="" width="390" height="844" /></div>
      <div class="map-scrim"></div>
      <div class="status-bar"><span>9:41</span><span class="sig"><i aria-hidden="true"></i></span></div>

      <div class="screen-layer">
        <header class="masthead">
          <div class="masthead-row">
            <div class="wordmark">Trust</div>
            <div class="masthead-actions">
              <a class="folio-link" href="#log">Log</a>
              <a class="folio-link" href="settings.html">You</a>
            </div>
          </div>
          <div class="masthead-rule"></div>
        </header>
        <div class="handle-line">@jordan</div>

        <div class="map-marks">
          <div class="you-dot" style="left:48%;top:40%" title="You"></div>
          <div class="sealed-chip" style="left:14%;top:26%">
            <svg class="lock" viewBox="0 0 10 12" aria-hidden="true"><rect x="1.5" y="5" width="7" height="5.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M3 5V3.4a2 2 0 014 0V5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            Alex · sealed
          </div>
          <div class="sealed-chip" style="left:54%;top:52%">
            <svg class="lock" viewBox="0 0 10 12" aria-hidden="true"><rect x="1.5" y="5" width="7" height="5.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M3 5V3.4a2 2 0 014 0V5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            Maya · sealed
          </div>
          <div class="sealed-chip" style="left:22%;top:62%">
            <svg class="lock" viewBox="0 0 10 12" aria-hidden="true"><rect x="1.5" y="5" width="7" height="5.5" fill="none" stroke="currentColor" stroke-width="1"/><path d="M3 5V3.4a2 2 0 014 0V5" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            Eli · sealed
          </div>
        </div>

        <nav class="people-strip" aria-label="People">
          <div class="strip-scroll">
            <a class="person-chip" href="person.html">
              <span class="name">Alex</span>
              <span class="verb"><span class="dot"></span> Away</span>
            </a>
            <a class="person-chip" href="look-confirm.html">
              <span class="name">Maya</span>
              <span class="verb accent">Overdue</span>
            </a>
            <a class="person-chip" href="person.html">
              <span class="name">Eli</span>
              <span class="verb"><span class="dot"></span> Home</span>
            </a>
            <a class="invite-chip" href="invite.html">
              <span class="plus">+</span>
              <span class="label">Invite</span>
            </a>
          </div>
        </nav>
      </div>
      <div class="home-indicator"></div>
    </div>

    <nav class="screen-links">
      <a href="home-after-look.html">After Look →</a>
      <a href="person.html">Person sheet</a>
      <a href="look-confirm.html">Look confirm</a>
      <a href="invite.html">Invite</a>
      <a href="settings.html">Settings</a>
    </nav>
  </div>
</body>
</html>
