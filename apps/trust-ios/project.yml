name: Trust
options:
  bundleIdPrefix: com.collapse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic
    TRUST_BASE_URL: https://trust-api-u0ft.onrender.com
  configs:
    Debug:
      TRUST_BASE_URL: http://127.0.0.1:5088
packages:
  TrustCore:
    path: .
targets:
  Trust:
    type: application
    platform: iOS
    sources:
      - path: Sources/TrustApp
      - path: Resources
        buildPhase: resources
        excludes:
          - Trust.storekit
          - Fonts/*.txt
    dependencies:
      - package: TrustCore
        product: TrustCore
      - sdk: AuthenticationServices.framework
      - sdk: MapKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.trust
        PRODUCT_NAME: Trust
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 19
        MARKETING_VERSION: 1.0
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: targeted
        CODE_SIGN_ENTITLEMENTS: Trust.entitlements
        DEVELOPMENT_TEAM: 3S529795M9
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Trust uses your location while the app is open so you can see yourself on the map and look at people who share with you. Trust does not sell your location.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Trust
        CFBundleDevelopmentRegion: en
        # English-only 1.0. Non-EN .lproj were removed in M0; regenerate later with
        # Scripts/emit_localizations.py if localization returns post-1.0.
        CFBundleLocalizations:
          - en
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.lifestyle
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: Paper
        UIAppFonts:
          - SpaceGrotesk-Variable.ttf
          - IBMPlexMono-Medium.ttf
        TRUST_BASE_URL: $(TRUST_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
        # iPhone: portrait only. iPad: all orientations (required for Split View / Stage Manager).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Trust uses your location while the app is open so you can see yourself on the map and look at people who share with you. Trust does not sell your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: Trust uses your location in the background so a Look still works when the app is closed. A confirmed Look is recorded and requests a notification. Trust does not sell your location.
        NSLocationAlwaysUsageDescription: Trust uses your location in the background so a Look still works when the app is closed. A confirmed Look is recorded and requests a notification. Trust does not sell your location.
        NSLocationTemporaryUsageDescriptionDictionary:
          PreciseEscrow: Trust needs precise location so a Look shows the current place. Approximate location is not enough.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - trust
    scheme:
      storeKitConfiguration: Resources/Trust.storekit
      testTargets:
        - TrustCoreTests
        - TrustUITests
  TrustCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TrustCoreTests
    dependencies:
      - package: TrustCore
        product: TrustCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.trust.tests
  TrustUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TrustUITests
    dependencies:
      - target: Trust
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.collapsetechnologies.trust.uitests
        TEST_TARGET_NAME: Trust
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3S529795M9
schemes:
  # L2 sandbox verification (M3 plan §"Sandbox / TestFlight / StoreKit testing path").
  # Physical device only — Simulator cannot do App Store Sandbox purchases.
  #   - StoreKit Configuration: None (no `storeKitConfiguration:` key below) so purchases
  #     route through the real StoreKit stack to the Sandbox App Store, not the local
  #     `.storekit` test cert.
  #   - TRUST_STRICT_API=1 makes AppConfiguration.debugAPICandidates / remapLoopbackOnDevice
  #     refuse to fall back to production when the configured Dev API is unreachable — the
  #     app fails loud (`reachabilityNotice` / offline state) instead of silently talking to
  #     the production API with a sandbox session. See AppConfiguration.swift.
  #   - TRUST_BASE_URL below is a placeholder. Replace <mac-mdns-name> with your Mac's mDNS
  #     name (System Settings → General → Sharing → Local hostname, or `scutil --get
  #     LocalHostName`), or a Tailscale MagicDNS name for off-Wi-Fi testing. Never commit a
  #     real LAN IP or hostname here — see apps/trust-ios/SANDBOX.md.
  Trust-Sandbox:
    build:
      targets:
        Trust: all
    run:
      config: Debug
      environmentVariables:
        TRUST_STRICT_API: "1"
        TRUST_BASE_URL: "http://<mac-mdns-name>.local:5088"
    test:
      config: Debug
      targets:
        - TrustCoreTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
